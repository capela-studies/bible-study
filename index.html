en:{plainTitle:'The Difference the Spirit Makes',brand:'',navStudy:'The study',navReflection:'Reflect',eyebrow:'BIBLE STUDY · 1 CORINTHIANS 2:14–16',heroTitle:'The Difference <em>the Spirit</em> Makes',heroIntro:'A thoughtful study on spiritual discernment, salvation by grace, humility, and what it means to live with the mind of Christ.',start:'Explore the study',reflect:'Questions for reflection',quote:'The Holy Spirit changes how we understand God’s Word, evaluate our decisions, and live our lives.',quoteRef:'CENTRAL MESSAGE',contents:'IN THIS STUDY',side:'Based on a sermon by Pastor Mark on 1 Corinthians 2:14–16. Organized and paraphrased for study.',lesson:'Key lesson',example:'Biblical example',finalTitle:'Final takeaway',reflectionTitle:'Your reflection',reflectionLead:'Take a moment to think about how these teachings connect with your everyday life. Your answers stay in your browser and are not sent anywhere.',placeholder:'Write your thoughts here…',copy:'Copy my reflections',copied:'Copied!',references:'Key Bible passages',closingNote:'This is a paraphrased study of Pastor Mark’s sermon, not a verbatim transcript. Biblical interpretations are presented in the context of the sermon.',sections:[
{title:'The natural person does not accept the things of God',ref:'1 Corinthians 2:14 · 22:49–36:28',lead:'Without the Holy Spirit, people cannot fully understand or appreciate God’s spiritual truth.',intro:'The pastor describes the natural person as someone who has not been born again and does not have the Holy Spirit dwelling within them.',bullets:['Being religious does not mean being saved. Someone may attend church, know the Bible, and follow traditions without personally knowing Jesus.','Nobody is born a Christian. Even children raised in Christian homes must develop their own faith.','Good behavior does not earn salvation. Kindness, intelligence, and good deeds do not replace God’s grace.','Salvation is a gift. Ephesians 2:8–10 teaches that people are saved by grace through faith, not through personal achievements.'],exampleTitle:'Paul before his conversion',exampleText:'Before following Jesus, Paul (formerly Saul) persecuted Christians. He was deeply religious and sincerely believed he was right. His example shows that religious knowledge and sincerity do not automatically equal spiritual understanding.',lessonText:'Good works follow salvation; they are not the price of salvation.'},
{title:'The spiritual person evaluates life through God’s truth',ref:'1 Corinthians 2:15 · 36:36–48:19',lead:'The Holy Spirit helps believers examine their choices and understand God’s truth.',intro:'Spiritual discernment means carefully evaluating thoughts, actions, and situations according to Scripture. It does not mean criticizing everyone or assuming that Christians are always right.',bullets:['Examine Scripture for yourself rather than accepting every teaching automatically.','Popularity does not prove truth. A large church or confident teacher can still be mistaken.','The pastor teaches that the Holy Spirit does not contradict Scripture.','Christians remain accountable and should be willing to accept correction.'],exampleTitle:'The Bereans',exampleText:'In Acts 17:10–12, the Bereans listened to Paul but examined the Scriptures daily to evaluate his teaching. They combined openness to learning with careful investigation.',lessonText:'Ask: Does this agree with Scripture? Does my attitude reflect Jesus? Am I obeying, or making excuses? Success alone does not prove faithfulness.'},
{title:'We have the mind of Christ and must live accordingly',ref:'1 Corinthians 2:16 · 48:27–57:29',lead:'Having the mind of Christ means letting Jesus’ teaching shape how we understand life and how we act.',intro:'It does not mean believers know everything, or that every thought they have comes from God. Instead, the Spirit helps them understand God’s wisdom and grow in Christlike attitudes.',bullets:['Humility is essential because human understanding is limited.','Spiritual knowledge should lead to action, not simply remain information.','Growing in faith means increasing in patience, humility, and obedience.','Jesus models servant leadership: although He had authority, He washed His disciples’ feet.'],exampleTitle:'Job and Jesus’ example',exampleText:'In Job 38:4, God reminds Job of the limits of human understanding. In John 13:3–17, Jesus demonstrates humility through service. Together, these examples invite both intellectual humility and practical compassion.',lessonText:'Spiritual maturity is not measured by status, knowledge, or authority, but by how we live and serve others.'},
{title:'Salvation and spiritual rewards are different',ref:'1 Corinthians 3:14–15 · 46:01–47:59',lead:'Salvation is received by grace; believers’ acts of faithful service still matter.',intro:'The pastor distinguishes between the gift of salvation and spiritual rewards connected with how a believer lives and serves.',bullets:['Salvation is a gift of God’s grace, received through faith in Jesus.','Good works do not purchase or earn salvation.','The pastor interprets spiritual rewards as related to the value of a believer’s faithful service.','Choices and stewardship matter, even though salvation is not earned.'],exampleTitle:'Paul’s picture of building',exampleText:'In 1 Corinthians 3:14–15, Paul uses the image of a work being tested. The sermon interprets this as a distinction between salvation and the rewards associated with one’s work.',lessonText:'Serve God out of love and gratitude, not as an attempt to buy His acceptance.'},
{title:'Knowing God’s Word is not enough. We must live it',ref:'1 Corinthians 3:1–3 · 54:22–59:36',lead:'Spiritual growth means allowing biblical truth to change everyday behavior.',intro:'Paul addresses believers still struggling with jealousy, division, and worldly attitudes. The pastor urges Christians to move beyond merely knowing the right words.',bullets:['Identify one specific challenge in your life.','Study what Scripture says about it, in context.','Pray for wisdom and guidance.','Make a practical change based on what you learn.','If you fail, acknowledge it and continue growing.'],exampleTitle:'The Corinthians’ immaturity',exampleText:'In 1 Corinthians 3:1–3, Paul describes people who belong to Christ but whose actions reveal immaturity. Faith should lead to ongoing growth, not complacency.',lessonText:'The goal is not simply to know God’s Word, but to live according to it.'}],verses:[['1 Corinthians 2:14–16','Spiritual understanding comes through the Holy Spirit.'],['Ephesians 2:8–10','Salvation comes by grace through faith, and good works follow.'],['Acts 16:13–15','God opened Lydia’s heart as she heard Paul’s message.'],['Acts 17:10–12','The Bereans tested teaching by examining Scripture.'],['2 Timothy 3:16','Scripture is useful for teaching, correction, and training.'],['Job 38:4','God’s wisdom exceeds human understanding.'],['John 13:3–17','Jesus demonstrates humility through service.'],['Philippians 2:5','Believers are called to Christlike attitudes.']],final:'True Christianity, according to the sermon, is not simply religious knowledge, church attendance, or good behavior. It is a relationship with Jesus Christ that changes how we think and live. The Holy Spirit helps believers understand Scripture, discern truth, accept correction, and mature in faith.',questions:['Am I simply learning about God, or am I allowing His teachings to change my life?','Do I examine Scripture for myself, or do I simply accept what others tell me?','When someone corrects me, do I respond with humility or defensiveness?','What is one specific area of my life where I need to grow spiritually?']},
pt:{plainTitle:'A Diferença que o Espírito Faz',brand:'',navStudy:'O estudo',navReflection:'Refletir',eyebrow:'ESTUDO BÍBLICO · 1 CORÍNTIOS 2:14–16',heroTitle:'A Diferença que <em>o Espírito</em> Faz',heroIntro:'Um estudo sobre discernimento espiritual, salvação pela graça, humildade e o que significa viver com a mente de Cristo.',start:'Explorar o estudo',reflect:'Perguntas para reflexão',quote:'O Espírito Santo transforma a forma como compreendemos a Palavra de Deus, avaliamos nossas decisões e vivemos.',quoteRef:'MENSAGEM CENTRAL',contents:'NESTE ESTUDO',side:'Baseado em um sermão do pastor Mark sobre 1 Coríntios 2:14–16. Conteúdo organizado e parafraseado para estudo.',lesson:'Lição principal',example:'Exemplo bíblico',finalTitle:'Conclusão',reflectionTitle:'Sua reflexão',reflectionLead:'Reserve um momento para pensar em como esses ensinamentos se conectam à sua vida. Suas respostas ficam no seu navegador e não são enviadas a ninguém.',placeholder:'Escreva sua reflexão aqui…',copy:'Copiar minhas reflexões',copied:'Copiado!',references:'Principais passagens bíblicas',closingNote:'Este é um estudo parafraseado do sermão do pastor Mark, não uma transcrição literal. As interpretações bíblicas são apresentadas no contexto do sermão.',sections:[
{title:'A pessoa natural não aceita as coisas de Deus',ref:'1 Coríntios 2:14 · 22:49–36:28',lead:'Sem o Espírito Santo, as pessoas não conseguem compreender plenamente as verdades espirituais de Deus.',intro:'O pastor descreve a pessoa natural como alguém que ainda não nasceu de novo e não possui o Espírito Santo habitando nela.',bullets:['Ser religioso não significa ser salvo. Alguém pode frequentar a igreja, conhecer a Bíblia e seguir tradições sem conhecer Jesus pessoalmente.','Ninguém nasce cristão automaticamente. Mesmo quem cresce em uma família cristã precisa desenvolver a própria fé.','Boas ações não garantem a salvação. Gentileza, inteligência e boas obras não substituem a graça de Deus.','A salvação é um presente. Efésios 2:8–10 ensina que somos salvos pela graça, mediante a fé, e não por nossos próprios méritos.'],exampleTitle:'Paulo antes da conversão',exampleText:'Antes de seguir Jesus, Paulo (antes chamado Saulo) perseguia os cristãos. Era profundamente religioso e acreditava sinceramente estar certo. Seu exemplo mostra que conhecimento religioso e sinceridade não significam automaticamente compreensão espiritual.',lessonText:'As boas obras são consequência da salvação, e não o preço que pagamos por ela.'},
{title:'A pessoa espiritual avalia a vida pela verdade de Deus',ref:'1 Coríntios 2:15 · 36:36–48:19',lead:'O Espírito Santo ajuda os cristãos a examinar suas escolhas e compreender a verdade de Deus.',intro:'Discernimento espiritual é avaliar cuidadosamente pensamentos, atitudes e situações à luz das Escrituras. Não significa criticar todas as pessoas ou acreditar que cristãos nunca erram.',bullets:['Examine a Bíblia por conta própria, sem aceitar automaticamente qualquer ensinamento.','Popularidade não comprova a verdade. Uma igreja grande ou um pregador confiante também pode se enganar.','O pastor ensina que o Espírito Santo não contradiz as Escrituras.','Cristãos continuam responsáveis por suas atitudes e devem aceitar correções.'],exampleTitle:'Os bereanos',exampleText:'Em Atos 17:10–12, os bereanos ouviam Paulo, mas examinavam diariamente as Escrituras para avaliar seus ensinamentos. Eles uniam disposição para aprender com investigação cuidadosa.',lessonText:'Pergunte: Isso está de acordo com a Bíblia? Minha atitude reflete Jesus? Estou obedecendo ou inventando desculpas? O sucesso não prova, por si só, fidelidade a Deus.'},
{title:'Temos a mente de Cristo e precisamos viver de acordo com ela',ref:'1 Coríntios 2:16 · 48:27–57:29',lead:'Ter a mente de Cristo significa permitir que os ensinamentos de Jesus moldem a forma como compreendemos a vida e agimos.',intro:'Isso não quer dizer que sabemos tudo ou que todos os nossos pensamentos vêm de Deus. Significa que o Espírito nos ajuda a compreender a sabedoria divina e desenvolver atitudes semelhantes às de Cristo.',bullets:['A humildade é essencial, porque nosso entendimento é limitado.','O conhecimento espiritual deve levar à prática, e não permanecer apenas como informação.','Crescer na fé significa desenvolver paciência, humildade e obediência.','Jesus é exemplo de liderança servidora: mesmo tendo autoridade, lavou os pés dos discípulos.'],exampleTitle:'Jó e o exemplo de Jesus',exampleText:'Em Jó 38:4, Deus lembra a Jó os limites da compreensão humana. Em João 13:3–17, Jesus demonstra humildade por meio do serviço. Esses exemplos nos convidam à humildade intelectual e ao cuidado prático com as pessoas.',lessonText:'A maturidade espiritual não é medida por posição, conhecimento ou autoridade, mas pela maneira como vivemos e servimos.'},
{title:'Salvação e recompensas espirituais são diferentes',ref:'1 Coríntios 3:14–15 · 46:01–47:59',lead:'A salvação é recebida pela graça; as ações de serviço fiel dos cristãos continuam sendo importantes.',intro:'O pastor distingue o presente da salvação das recompensas espirituais relacionadas à forma como a pessoa vive e serve.',bullets:['A salvação é um presente da graça de Deus, recebido pela fé em Jesus.','As boas obras não compram nem conquistam a salvação.','O pastor interpreta as recompensas espirituais como relacionadas ao valor do serviço fiel.','As escolhas e a responsabilidade no serviço importam, ainda que a salvação não seja conquistada por mérito.'],exampleTitle:'A imagem da construção usada por Paulo',exampleText:'Em 1 Coríntios 3:14–15, Paulo descreve uma obra sendo provada. O sermão interpreta essa passagem como uma distinção entre salvação e recompensas relacionadas ao trabalho de cada pessoa.',lessonText:'Sirva a Deus por amor e gratidão, e não como tentativa de comprar sua aceitação.'},
{title:'Conhecer a Palavra de Deus não basta: precisamos praticá-la',ref:'1 Coríntios 3:1–3 · 54:22–59:36',lead:'O crescimento espiritual significa permitir que a verdade bíblica transforme nossas atitudes cotidianas.',intro:'Paulo fala de cristãos que ainda enfrentavam ciúmes, divisões e atitudes mundanas. O pastor incentiva os fiéis a irem além de simplesmente conhecer as palavras certas.',bullets:['Identifique uma dificuldade específica na sua vida.','Estude o que a Bíblia diz sobre ela, considerando o contexto.','Ore pedindo sabedoria e orientação.','Faça uma mudança prática com base no que aprendeu.','Se errar, reconheça e continue crescendo.'],exampleTitle:'A imaturidade dos coríntios',exampleText:'Em 1 Coríntios 3:1–3, Paulo descreve pessoas que pertencem a Cristo, mas cujas atitudes revelam imaturidade. A fé deve levar a um crescimento contínuo, e não à acomodação.',lessonText:'O objetivo não é apenas conhecer a Palavra de Deus, mas viver de acordo com ela.'}],verses:[['1 Coríntios 2:14–16','A compreensão espiritual vem por meio do Espírito Santo.'],['Efésios 2:8–10','A salvação acontece pela graça, mediante a fé, e as boas obras são consequência.'],['Atos 16:13–15','Deus abriu o coração de Lídia enquanto ela ouvia Paulo.'],['Atos 17:10–12','Os bereanos examinavam as Escrituras para avaliar o ensino.'],['2 Timóteo 3:16','A Bíblia é útil para ensinar, corrigir e instruir.'],['Jó 38:4','A sabedoria de Deus ultrapassa a compreensão humana.'],['João 13:3–17','Jesus demonstra humildade por meio do serviço.'],['Filipenses 2:5','Os cristãos são chamados a desenvolver atitudes semelhantes às de Cristo.']],final:'De acordo com o sermão, o verdadeiro cristianismo não se resume a conhecimento religioso, frequência na igreja ou bom comportamento. É um relacionamento com Jesus Cristo que transforma nossa maneira de pensar e viver. O Espírito Santo ajuda os cristãos a compreender as Escrituras, discernir a verdade, aceitar correções e amadurecer na fé.',questions:['Estou apenas aprendendo sobre Deus ou permitindo que seus ensinamentos transformem minha vida?','Eu examino as Escrituras por conta própria ou apenas aceito o que outras pessoas dizem?','Quando alguém me corrige, respondo com humildade ou fico na defensiva?','Qual é uma área específica da minha vida em que preciso amadurecer espiritualmente?']}};

 en:[
  [{heading:'Why this matters',paragraphs:['A person may know how church works, memorize religious language, or even study the Bible academically without personally trusting Jesus. The pastor uses Paul’s life to distinguish religious familiarity from a relationship with Christ.','The sermon also makes an important clarification: people who do not believe can still show kindness and love. The point is not that every unbeliever acts badly, but that moral behavior and spiritual understanding are different things.']},{heading:'The role of grace',paragraphs:['Ephesians 2:8–10 places salvation before good works: grace is received through faith, and good works are a way of living afterward. This challenges the idea that someone must accumulate enough good actions to deserve acceptance.','The account of Lydia in Acts 16:13–15 gives another example. Paul explained the message, and the Lord opened her heart to respond. The pastor stresses both communicating the gospel clearly and depending on God rather than thinking the speaker alone can change someone.']}],
  [{heading:'Discernment is careful examination',paragraphs:['In Acts 17:10–12, the Bereans welcomed Paul’s teaching while checking it against Scripture. The pastor invites listeners to do the same with his own sermons. Confidence, reputation, and a large congregation cannot replace examining what is taught.','The phrase about the spiritual person not being judged by others does not remove accountability. The sermon points to Paul correcting Peter in Galatians 2: being a respected leader did not place Peter above correction.']},{heading:'Questions to ask before deciding',items:['Does this agree with God’s Word when read in context?','Does my attitude reflect the character of Jesus?','Am I taking a faithful step, or just finding an excuse for what I already want?'],paragraphs:['The sermon distinguishes something that works from something that is faithful. A profitable business decision or a successful religious program, for example, may still involve dishonest or manipulative behavior. Outcomes alone are not the standard.']}],
  [{heading:'Job: humility when answers are limited',paragraphs:['Job 38:4 reminds Job that he did not create the world and cannot see everything from God’s perspective. In the sermon, this example is an invitation to recognize the limits of human understanding without dismissing the reality of suffering.']},{heading:'Jesus: authority expressed through service',paragraphs:['In John 13:3–17, Jesus washes His disciples’ feet. The pastor emphasizes that Jesus did not need to prove His status; He used His position to serve. Having the mind of Christ therefore becomes visible through humble action, not through claims of superior knowledge.','Having the mind of Christ also does not mean knowing every answer or assuming every thought comes from God. It means learning to understand God’s saving wisdom through the Holy Spirit and applying it to life.']}],
  [{heading:'Two ideas that should not be confused',table:[['Salvation','Spiritual rewards'],['A gift of grace received through faith','Connected to how believers serve'],['Not earned by achievements or good deeds','The value of a believer’s work still matters'],['The basis is Christ’s completed work','Faithful action follows as a response']],paragraphs:['The pastor uses Paul’s image of a building in 1 Corinthians 3:14–15 to explain this distinction. The work may be evaluated, but the sermon stresses that this is not a way to pay for salvation. His encouragement is to serve with gratitude, not fear of failing to earn acceptance.']}],
  [{heading:'A practical challenge for this week',items:['Choose one specific struggle, habit, or attitude.','Find a relevant passage and read it in context.','Pray about what the passage teaches.','Take one concrete step that reflects what you learned.','If you fall short, acknowledge it and continue growing.'],paragraphs:['Paul describes jealousy and division among the Corinthians as signs of immaturity. The sermon closes with a reminder that learning Christian vocabulary or attending services is not the finish line: faith should affect how people respond at home, at work, and in relationships.']}]

 pt:[
  [{heading:'Por que isso é importante',paragraphs:['Uma pessoa pode conhecer os costumes da igreja, dominar a linguagem religiosa ou até estudar a Bíblia academicamente sem confiar pessoalmente em Jesus. O pastor usa a história de Paulo para diferenciar familiaridade com a religião e relacionamento com Cristo.','O sermão também faz uma ressalva: pessoas que não creem podem demonstrar amor, generosidade e bondade. O argumento não é que todo não cristão se comporta mal, mas que comportamento moral e compreensão espiritual não são a mesma coisa.']},{heading:'O papel da graça',paragraphs:['Efésios 2:8–10 apresenta a salvação antes das boas obras: a graça é recebida mediante a fé, e as boas obras expressam a maneira de viver depois disso. Essa ideia contraria a tentativa de acumular méritos para merecer a aceitação de Deus.','A história de Lídia, em Atos 16:13–15, oferece outro exemplo. Paulo anunciou a mensagem e Deus abriu o coração dela para responder. O pastor destaca tanto a importância de explicar o evangelho com clareza quanto a necessidade de depender de Deus.']}],
  [{heading:'Discernimento exige examinar com cuidado',paragraphs:['Em Atos 17:10–12, os bereanos recebiam o ensino de Paulo e o comparavam com as Escrituras. O pastor pede que os ouvintes façam o mesmo com as próprias pregações dele. Convicção, reputação e uma igreja cheia não substituem a análise do que está sendo ensinado.','Quando Paulo afirma que a pessoa espiritual não é julgada por ninguém, isso não significa que ela esteja acima de correções. O sermão lembra que Paulo corrigiu Pedro em Gálatas 2: a posição de liderança não tornava suas atitudes inquestionáveis.']},{heading:'Perguntas antes de tomar uma decisão',items:['Isso está de acordo com a Palavra de Deus, lida em seu contexto?','Minha atitude reflete o caráter de Jesus?','Estou sendo fiel ao que aprendi ou apenas procurando uma desculpa para fazer o que quero?'],paragraphs:['O pastor diferencia aquilo que dá resultado daquilo que é fiel a Deus. Uma decisão lucrativa no trabalho ou uma iniciativa religiosa bem-sucedida ainda pode envolver desonestidade ou manipulação. O resultado, sozinho, não serve como critério.']}],
  [{heading:'Jó: humildade diante do que não entendemos',paragraphs:['Em Jó 38:4, Deus lembra a Jó que ele não criou o mundo e não consegue enxergar tudo a partir da perspectiva divina. No sermão, isso convida a reconhecer os limites do entendimento humano sem negar a realidade do sofrimento.']},{heading:'Jesus: autoridade demonstrada no serviço',paragraphs:['Em João 13:3–17, Jesus lava os pés dos discípulos. O pastor destaca que Jesus não precisava provar sua posição: Ele usou sua autoridade para servir. Ter a mente de Cristo aparece, portanto, nas atitudes humildes, e não na pretensão de saber mais do que todos.','Ter a mente de Cristo também não significa saber todas as respostas ou acreditar que cada pensamento vem de Deus. Significa aprender a compreender a sabedoria da salvação pelo Espírito Santo e aplicá-la à vida.']}],
  [{heading:'Duas ideias que não devem ser confundidas',table:[['Salvação','Recompensas espirituais'],['Presente da graça recebido pela fé','Relacionadas à maneira de servir'],['Não é conquistada por méritos ou boas ações','O valor do trabalho de cada cristão importa'],['Sua base é a obra concluída por Cristo','O serviço fiel vem como resposta de gratidão']],paragraphs:['O pastor usa a imagem de uma construção, presente em 1 Coríntios 3:14–15, para explicar a diferença. As obras podem ser avaliadas, mas o sermão reforça que isso não é uma forma de pagar pela salvação. O incentivo é servir por gratidão, não por medo de não merecer aceitação.']}],
  [{heading:'Desafio prático para esta semana',items:['Escolha uma dificuldade, um hábito ou uma atitude específica.','Encontre uma passagem relacionada e leia no contexto.','Ore sobre o que essa passagem ensina.','Dê um passo concreto de mudança com base no que aprendeu.','Se falhar, reconheça e continue amadurecendo.'],paragraphs:['Paulo apresenta os ciúmes e as divisões entre os coríntios como sinais de imaturidade. O sermão termina lembrando que aprender palavras cristãs ou frequentar cultos não é o objetivo final: a fé deve influenciar a maneira como agimos em casa, no trabalho e nos relacionamentos.']}]
 ]
};
function renderExtended(lang,index){const blocks=extendedStudy[lang]?.[index]||[];return blocks.map(block=>`<div class="study-detail"><h3>${escapeHTML(block.heading)}</h3>${(block.paragraphs||[]).map(t=>`<p>${escapeHTML(t)}</p>`).join('')}${block.items?`<ol>${block.items.map(t=>`<li>${escapeHTML(t)}</li>`).join('')}</ol>`:''}${block.table?`<div class="comparison-table"><table><thead><tr>${block.table[0].map(x=>`<th>${escapeHTML(x)}</th>`).join('')}</tr></thead><tbody>${block.table.slice(1).map(row=>`<tr>${row.map(cell=>`<td>${escapeHTML(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}</div>`).join('')}
function saveAnswers(){document.querySelectorAll('.question textarea').forEach((field,i)=>getAnswers()[i]=field.value)}
function render(lang){language=lang;document.documentElement.lang=lang==='pt'?'pt-BR':'en';const d=selectedStudy[lang];refreshPicker();sourceCredit();renderCalendar();document.title=(d.plainTitle||d.heroTitle.replace(/<[^>]*>/g,''))+' | Bible Study';$('brandText').textContent=d.brand;$('footerBrand').textContent=d.brand;$('navStudy').textContent=d.navStudy;$('navReflection').textContent=d.navReflection;$('eyebrow').textContent=d.eyebrow;$('heroTitle').innerHTML=escapeHTML(d.heroTitle).replace(/&lt;em&gt;/g,'<em>').replace(/&lt;\/em&gt;/g,'</em>');$('heroIntro').textContent=d.heroIntro;$('startButton').textContent=d.start;$('reflectButton').textContent=d.reflect;$('quote').textContent=d.quote;$('quoteRef').textContent=d.quoteRef;$('contentsTitle').textContent=d.contents;$('sideInfo').textContent=d.side;$('footerNote').textContent=d.closingNote;$('enBtn').classList.toggle('active',lang==='en');$('ptBtn').classList.toggle('active',lang==='pt');$('enBtn').setAttribute('aria-pressed',String(lang==='en'));$('ptBtn').setAttribute('aria-pressed',String(lang==='pt'));
$('toc').innerHTML=d.sections.map((s,i)=>`<a href="#section-${i+1}">${String(i+1).padStart(2,'0')} · ${escapeHTML(s.title)}</a>`).join('')+`<a href="#references">${escapeHTML(d.references)}</a><a href="#reflection">${escapeHTML(d.reflectionTitle)}</a>`;
$('sections').innerHTML=d.sections.map((s,i)=>`<section class="section" id="section-${i+1}"><span class="section-index">${lang==='en'?'PART':'PARTE'} ${String(i+1).padStart(2,'0')}</span><h2>${escapeHTML(s.title)}</h2><p class="meta">${escapeHTML(s.ref)}</p><p class="lead">${escapeHTML(s.lead)}</p><p>${escapeHTML(s.intro)}</p><ul>${s.bullets.map(b=>`<li>${escapeHTML(b)}</li>`).join('')}</ul><h3>${escapeHTML(d.example)}: ${escapeHTML(s.exampleTitle)}</h3><p>${escapeHTML(s.exampleText)}</p><div class="note"><p class="note-label">${escapeHTML(d.lesson)}</p><p>${escapeHTML(s.lessonText)}</p></div>${selectedStudy.id===builtInStudy.id?renderExtended(lang,i):''}</section>`).join('')+`<section class="section" id="references"><span class="section-index">${lang==='en'?'SCRIPTURE':'ESCRITURAS'}</span><h2>${escapeHTML(d.references)}</h2><div class="verse-list">${d.verses.map(v=>`<div class="verse"><strong>${escapeHTML(v[0])}</strong><span>${escapeHTML(v[1])}</span></div>`).join('')}</div></section><section class="section"><span class="section-index">${lang==='en'?'TO REMEMBER':'PARA LEMBRAR'}</span><h2>${escapeHTML(d.finalTitle)}</h2><div class="takeaway"><p>${escapeHTML(d.final)}</p></div></section><section class="section" id="reflection"><span class="section-index">${lang==='en'?'PERSONAL STUDY':'ESTUDO PESSOAL'}</span><h2>${escapeHTML(d.reflectionTitle)}</h2><p class="reflection-intro">${escapeHTML(d.reflectionLead)}</p>${d.questions.map((q,i)=>`<div class="question"><label for="answer-${i}">${i+1}. ${escapeHTML(q)}</label><textarea id="answer-${i}" placeholder="${escapeHTML(d.placeholder)}"></textarea></div>`).join('')}<div class="actions"><button type="button" id="copyAnswers">${escapeHTML(d.copy)}</button><span class="copy-note" id="copyMessage" role="status" aria-live="polite"></span></div></section>`;
document.querySelectorAll('.question textarea').forEach((el,i)=>{el.value=getAnswers()[i]||'';el.addEventListener('input',saveAnswers)});$('copyAnswers').addEventListener('click',async()=>{saveAnswers();const text=d.questions.map((q,i)=>`${i+1}. ${q}\n${(getAnswers()[i]||'')}`).join('\n\n');try{await navigator.clipboard.writeText(text);$('copyMessage').textContent=d.copied}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();$('copyMessage').textContent=d.copied}})}
$('studyPicker').addEventListener('change',event=>changeStudy(event.target.value));$('prevMonth').addEventListener('click',()=>{calendarMonth--;if(calendarMonth<0){calendarMonth=11;calendarYear--}renderCalendar()});$('nextMonth').addEventListener('click',()=>{calendarMonth++;if(calendarMonth>11){calendarMonth=0;calendarYear++}renderCalendar()});
const requestedStudy=new URLSearchParams(location.search).get('study');selectedStudy=allStudies.find(s=>s.id===requestedStudy)||(new URLSearchParams(location.search).get('preview')==='1'?allStudies[allStudies.length-1]:builtInStudy);
if(selectedStudy.date){calendarYear=Number(selectedStudy.date.slice(0,4));calendarMonth=Number(selectedStudy.date.slice(5,7))-1}
$('enBtn').addEventListener('click',()=>{if(language!=='en'){saveAnswers();render('en')}});$('ptBtn').addEventListener('click',()=>{if(language!=='pt'){saveAnswers();render('pt')}});render('en');
</script>
</body>
